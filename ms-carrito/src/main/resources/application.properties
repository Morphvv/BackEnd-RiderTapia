spring.application.name=ms-carrito
server.port=8089

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ridertapia_carrito?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Springdoc / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.springdoc-hateoas-enabled=false

# Microservicios consumidos
ms.productos.variantes-url=http://localhost:8085/api/v1/variantes
ms.productos.cupones-url=http://localhost:8085/api/v1/cupones
ms.inventario.url=http://localhost:8088/api/v1/items-inventario
ms.clientes.url=http://localhost:8082/api/v1/clientes
