# H2 en memoria: los tests no dependen de MySQL
spring.datasource.url=jdbc:h2:mem:msCarrito;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Springdoc deshabilitado en tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# URLs de ms-productos y ms-inventario (en los tests RestTemplate está mockeado)
ms.productos.variantes-url=http://localhost:8085/api/v1/variantes
ms.productos.cupones-url=http://localhost:8085/api/v1/cupones
ms.inventario.url=http://localhost:8088/api/v1/items-inventario
ms.clientes.url=http://localhost:8082/api/v1/clientes
