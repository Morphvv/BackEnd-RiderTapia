spring.application.name=reportes-service
server.port=8084

# Base de datos (ajusta usuario y clave según tu MySQL local)
spring.datasource.url=jdbc:mysql://localhost:3306/ridertapia_reportes?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URL del microservicio de pedidos.
# IMPORTANTE: cambia el puerto por el que use tu servicio de pedidos (variable PEDIDOS_SERVICE_URL).
pedidos.service.url=${PEDIDOS_SERVICE_URL:http://localhost:8086}

# Estados de pedido que cuentan como VENTA (separados por coma, deben coincidir con tu enum EstadoPedido).
# Los pedidos en otros estados (pendientes de pago, cancelados, anulados) no suman a los reportes
# ni pueden tener boleta o factura.
reportes.estados-venta=${ESTADOS_VENTA:PAGADO,EN_PREPARACION,LISTO_PARA_RETIRO,RETIRADO}

# Cuántos productos incluye por defecto el ranking de más vendidos
reportes.top-productos=10
