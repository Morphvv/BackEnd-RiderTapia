spring.application.name=usuario-service
server.port=8081

# Base de datos (ajusta usuario y clave según tu MySQL local)
spring.datasource.url=jdbc:mysql://localhost:3306/ridertapia_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
