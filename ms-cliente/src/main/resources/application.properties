spring.application.name=cliente-service
server.port=8082

# Base de datos (ajusta usuario y clave según tu MySQL local)
spring.datasource.url=jdbc:mysql://localhost:3306/ridertapia_clientes?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URL del microservicio de usuarios (se usa para validar que el RUT tenga cuenta)
usuario.service.url=${USUARIO_SERVICE_URL:http://localhost:8081}
